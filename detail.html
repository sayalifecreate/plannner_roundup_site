<!DOCTYPE html>
<html lang="ja">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=LINE+Seed+JP&family=M+PLUS+Rounded+1c&family=Zen+Kaku+Gothic+New:wght@500&display=swap" rel="stylesheet">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳細 | ATTIC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">ATTIC</a>
      
      <div class="header-actions">
      <!-- 検索ボタン -->
      <button type="button" class="icon-btn" aria-label="検索">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      
        <!-- 2. お気に入り -->
      <button type="button" class="icon-btn" onclick="location.href='favorite.html';" aria-label="お気に入り">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>

        <!-- 3. ハンバーガーボタン -->
        <button type="button" class="header-icon-btn" id="open-menu-btn" aria-label="メニューを開く">
          <div class="hamburger-btn">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </div>
        </button>
      </div>
    </div>
  </header>


  <!-- メインコンテンツ領域 -->
  <main class="main-container">

  <!-- パンくずナビゲーション -->
  <nav class="breadcrumb" id="breadcrumb">
    <a href="index.html">HOME</a> &gt; <span id="bc-title">読み込み中...</span>
  </nav>

  <!-- JSでここにデータが挿入されます -->
  <div class="product-detail-wrapper" id="product-detail">
    <p style="text-align:center; padding: 40px;">データを読み込んでいます...</p>
  </div>

</main>

    

<script src="detail.js"></script>

<!-- オーバーレイ背景 -->
<div id="drawer-overlay" class="drawer-overlay"></div>

<!-- ドロワーメニュー本体 -->
<aside id="drawer-menu" class="drawer-menu">

  <div class="drawer-header">
    <div class="header-icons-right">
      <!-- 検索ボタン -->
      <button type="button" class="icon-btn" aria-label="検索">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      <!-- お気に入りボタン -->
      <button type="button" class="icon-btn" onclick="location.href='favorite.html';" aria-label="お気に入り">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>

      <!-- アカウントボタン -->
      <button type="button" class="icon-btn" aria-label="アカウント">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>

      <!-- 閉じる（×）ボタン -->
      <button type="button" id="close-menu-btn" class="icon-btn close-btn" aria-label="閉じる">
        <span class="cross-bar"></span>
        <span class="cross-bar"></span>
      </button>
    </div>
  </div>

  <!-- ② JSONから自動生成するエリア -->
  <div class="drawer-body">
    
    <!-- キーワード検索バー -->
    <div class="search-box">
      <input type="text" placeholder="キーワード検索" id="drawer-keyword-input">
      <button type="button" class="search-submit-btn" aria-label="検索実行">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <!-- カラー -->
    <div class="filter-section">
      <div class="filter-label">Color</div>
      <div class="color-picker-grid" id="drawer-color-list"></div>
    </div>

    <!-- サイズ -->
    <div class="filter-section">
      <div class="filter-label">Size</div>
      <div class="chip-group" id="drawer-size-list"></div>
    </div>

    <!-- レイアウト（フォーマット） -->
    <div class="filter-section">
      <div class="filter-label">Layout</div>
      <div class="layout-grid" id="drawer-layout-list"></div>
    </div>

    <!-- MONTHの見出しと領域 -->
    <div class="filter-section">
      <div class="filter-label">MONTH</div>
      <div id="drawer-month-list" class="filter-chips"></div>
    </div>

    <!-- DAYの見出しと領域 -->
    <div class="filter-section">
      <div class="filter-label">DAY</div>
      <div id="drawer-day-list" class="filter-chips"></div>
    </div>

    <!-- ブランド / シリーズ（タブ切替＋件数付き） -->
    <div class="filter-section tab-section">
      <div class="tab-header">
        <button type="button" class="tab-btn active" data-tab="tab-brand">ブランド</button>
        <button type="button" class="tab-btn" data-tab="tab-series">シリーズ</button>
      </div>

      <div class="tab-content">
        <!-- ブランド一覧 -->
        <div id="tab-brand" class="tab-pane active">
          <ul class="count-list" id="drawer-brand-list"></ul>
        </div>

        <!-- シリーズ一覧 -->
        <div id="tab-series" class="tab-pane">
          <ul class="count-list" id="drawer-series-list"></ul>
        </div>
      </div>
    </div>

  </div>
</aside>

<footer>
  <p>© room38.plannercatalog</p>
</footer>

</body>
</html>
